<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" width="100%" style="max-width: 820px; height: auto; display: block; margin: 20px auto; background: #0d120f; border-radius: 8px; border: 1px solid rgba(46, 204, 113, 0.2); font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="fsm-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#2ecc71" />
    </marker>
    <marker id="fsm-sec-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#a3b8aa" />
    </marker>
  </defs>

  <!-- States -->
  <!-- IDLE -->
  <rect x="20" y="30" width="80" height="45" rx="6" fill="#151d18" stroke="#2ecc71" stroke-width="2" />
  <text x="60" y="58" fill="#e6eee8" font-size="11" font-weight="bold" text-anchor="middle">IDLE</text>

  <!-- INIT -->
  <rect x="150" y="30" width="80" height="45" rx="6" fill="#151d18" stroke="#2ecc71" stroke-width="1.5" />
  <text x="190" y="58" fill="#e6eee8" font-size="11" font-weight="bold" text-anchor="middle">INIT</text>

  <!-- FOLLOW_LINE_ODOMETRY -->
  <rect x="280" y="30" width="170" height="45" rx="6" fill="#151d18" stroke="#2ecc71" stroke-width="1.5" />
  <text x="365" y="58" fill="#e6eee8" font-size="10" font-weight="bold" text-anchor="middle">LINE FOLLOW (ODOMETRY)</text>

  <!-- FACE_DIRECTION -->
  <rect x="500" y="30" width="130" height="45" rx="6" fill="#151d18" stroke="#2ecc71" stroke-width="1.5" />
  <text x="565" y="58" fill="#e6eee8" font-size="11" font-weight="bold" text-anchor="middle">FACE DIRECTION</text>

  <!-- FIND_FRUIT -->
  <rect x="670" y="115" width="100" height="45" rx="6" fill="#151d18" stroke="#2ecc71" stroke-width="1.5" />
  <text x="720" y="142" fill="#e6eee8" font-size="11" font-weight="bold" text-anchor="middle">FIND FRUIT</text>

  <!-- APPROACH_FRUIT -->
  <rect x="660" y="225" width="120" height="45" rx="6" fill="#151d18" stroke="#2ecc71" stroke-width="1.5" />
  <text x="720" y="252" fill="#e6eee8" font-size="11" font-weight="bold" text-anchor="middle">APPROACH FRUIT</text>

  <!-- PICK_FRUIT -->
  <rect x="510" y="340" width="110" height="45" rx="6" fill="#151d18" stroke="#2ecc71" stroke-width="1.5" />
  <text x="565" y="368" fill="#e6eee8" font-size="11" font-weight="bold" text-anchor="middle">PICK FRUIT</text>

  <!-- FIND_LINE -->
  <rect x="310" y="340" width="110" height="45" rx="6" fill="#151d18" stroke="#2ecc71" stroke-width="1.5" />
  <text x="365" y="368" fill="#e6eee8" font-size="11" font-weight="bold" text-anchor="middle">FIND LINE</text>

  <!-- FOLLOW_LINE_SONAR -->
  <rect x="495" y="185" width="140" height="45" rx="6" fill="#151d18" stroke="#2ecc71" stroke-width="1.5" />
  <text x="565" y="212" fill="#e6eee8" font-size="10" font-weight="bold" text-anchor="middle">LINE FOLLOW (SONAR)</text>

  <!-- FIND_BASKET -->
  <rect x="300" y="185" width="130" height="45" rx="6" fill="#151d18" stroke="#2ecc71" stroke-width="1.5" />
  <text x="365" y="212" fill="#e6eee8" font-size="11" font-weight="bold" text-anchor="middle">FIND BASKET</text>

  <!-- DUMP_FRUIT -->
  <rect x="140" y="185" width="100" height="45" rx="6" fill="#151d18" stroke="#2ecc71" stroke-width="1.5" />
  <text x="190" y="212" fill="#e6eee8" font-size="11" font-weight="bold" text-anchor="middle">DUMP FRUIT</text>

  <!-- YIPEE -->
  <rect x="145" y="340" width="90" height="45" rx="6" fill="#151d18" stroke="#2ecc71" stroke-width="1.5" />
  <text x="190" y="368" fill="#e6eee8" font-size="11" font-weight="bold" text-anchor="middle">YIPEE</text>


  <!-- Transitions -->
  <!-- IDLE -> INIT -->
  <path d="M 100 52.5 L 142 52.5" fill="none" stroke="#2ecc71" stroke-width="1.5" marker-end="url(#fsm-arrow)" />
  <text x="121" y="44" fill="#a3b8aa" font-size="8.5" text-anchor="middle">Bumper Btn</text>

  <!-- INIT -> FOLLOW_LINE_ODOMETRY -->
  <path d="M 230 52.5 L 272 52.5" fill="none" stroke="#2ecc71" stroke-width="1.5" marker-end="url(#fsm-arrow)" />
  <text x="251" y="44" fill="#a3b8aa" font-size="8.5" text-anchor="middle">Calibrated</text>

  <!-- FOLLOW_LINE_ODOMETRY -> FACE_DIRECTION -->
  <path d="M 450 52.5 L 492 52.5" fill="none" stroke="#2ecc71" stroke-width="1.5" marker-end="url(#fsm-arrow)" />
  <text x="471" y="44" fill="#a3b8aa" font-size="8.5" text-anchor="middle">Reached X</text>

  <!-- FACE_DIRECTION -> FIND_FRUIT -->
  <path d="M 610 75 C 640 85, 680 100, 694 110" fill="none" stroke="#2ecc71" stroke-width="1.5" marker-end="url(#fsm-arrow)" />
  <text x="659" y="85" fill="#a3b8aa" font-size="8.5" text-anchor="middle" transform="rotate(22, 659, 85)">Aligned</text>

  <!-- FIND_FRUIT -> APPROACH_FRUIT -->
  <path d="M 720 160 L 720 217" fill="none" stroke="#2ecc71" stroke-width="1.5" marker-end="url(#fsm-arrow)" />
  <text x="725" y="193" fill="#a3b8aa" font-size="8.5" text-anchor="start">Fruit Seen</text>

  <!-- FIND_FRUIT -> FACE_DIRECTION (fallback boundary) -->
  <path d="M 670 137.5 C 600 137.5, 565 110, 565 82" fill="none" stroke="#a3b8aa" stroke-width="1.2" stroke-dasharray="2,2" marker-end="url(#fsm-sec-arrow)" />
  <text x="590" y="125" fill="#a3b8aa" font-size="8" text-anchor="middle">Not Found</text>

  <!-- APPROACH_FRUIT -> PICK_FRUIT -->
  <path d="M 680 270 C 630 295, 590 315, 575 332" fill="none" stroke="#2ecc71" stroke-width="1.5" marker-end="url(#fsm-arrow)" />
  <text x="630" y="302" fill="#a3b8aa" font-size="8.5" text-anchor="middle" transform="rotate(22, 630, 302)">In Range</text>

  <!-- APPROACH_FRUIT -> FIND_FRUIT (fallback target lost) -->
  <path d="M 740 225 C 755 205, 755 185, 740 167.5" fill="none" stroke="#a3b8aa" stroke-width="1.2" stroke-dasharray="2,2" marker-end="url(#fsm-sec-arrow)" />
  <text x="758" y="193" fill="#a3b8aa" font-size="8" text-anchor="start">Lost</text>

  <!-- PICK_FRUIT -> FIND_LINE -->
  <path d="M 510 362.5 L 428 362.5" fill="none" stroke="#2ecc71" stroke-width="1.5" marker-end="url(#fsm-arrow)" />
  <text x="469" y="354" fill="#a3b8aa" font-size="8.5" text-anchor="middle">Harvested</text>

  <!-- FACE_DIRECTION -> FOLLOW_LINE_SONAR -->
  <path d="M 565 75 L 565 177" fill="none" stroke="#2ecc71" stroke-width="1.5" marker-end="url(#fsm-arrow)" />
  <text x="570" y="130" fill="#a3b8aa" font-size="8.5" text-anchor="start">Carrying Fruit</text>

  <!-- FOLLOW_LINE_SONAR -> FIND_BASKET -->
  <path d="M 495 207.5 L 438 207.5" fill="none" stroke="#2ecc71" stroke-width="1.5" marker-end="url(#fsm-arrow)" />
  <text x="466.5" y="199" fill="#a3b8aa" font-size="8.5" text-anchor="middle">Wall Close</text>

  <!-- FIND_BASKET -> DUMP_FRUIT -->
  <path d="M 300 207.5 L 248 207.5" fill="none" stroke="#2ecc71" stroke-width="1.5" marker-end="url(#fsm-arrow)" />
  <text x="274" y="199" fill="#a3b8aa" font-size="8.5" text-anchor="middle">At Basket Y</text>

  <!-- DUMP_FRUIT -> FIND_LINE -->
  <path d="M 190 230 C 190 290, 240 330, 310 350" fill="none" stroke="#2ecc71" stroke-width="1.5" marker-end="url(#fsm-arrow)" />
  <text x="240" y="300" fill="#a3b8aa" font-size="8.5" text-anchor="middle" transform="rotate(35, 240, 300)">Dumped</text>

  <!-- FIND_LINE -> FOLLOW_LINE_ODOMETRY -->
  <path d="M 365 340 L 365 83" fill="none" stroke="#2ecc71" stroke-width="1.5" marker-end="url(#fsm-arrow)" />
  <text x="360" y="160" fill="#a3b8aa" font-size="8.5" text-anchor="end" transform="rotate(-90, 360, 160)">Re-acquired &amp; Row &lt; 5</text>

  <!-- FIND_LINE -> YIPEE -->
  <path d="M 310 362.5 L 243 362.5" fill="none" stroke="#2ecc71" stroke-width="1.5" marker-end="url(#fsm-arrow)" />
  <text x="276.5" y="354" fill="#a3b8aa" font-size="8.5" text-anchor="middle">All Rows Done</text>

  <!-- YIPEE -> IDLE -->
  <path d="M 145 362.5 C 80 362.5, 60 200, 60 83" fill="none" stroke="#2ecc71" stroke-width="1.5" marker-end="url(#fsm-arrow)" />
  <text x="52" y="240" fill="#a3b8aa" font-size="8.5" text-anchor="middle" transform="rotate(90, 52, 240)">Finished</text>
</svg>
