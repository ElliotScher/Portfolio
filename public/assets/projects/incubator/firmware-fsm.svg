<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" style="max-width: 600px; height: auto; display: block; margin: 20px auto; background: #243028; border-radius: 8px; border: 1px solid rgba(46, 204, 113, 0.2); font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="fsm-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#2ecc71" />
    </marker>
    <marker id="fsm-cancel-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#e74c3c" />
    </marker>
  </defs>

  <!-- States -->
  <rect x="25" y="130" width="90" height="50" rx="6" fill="#1c261f" stroke="#2ecc71" stroke-width="2" />
  <text x="70" y="160" fill="#e6eee8" font-size="12" font-weight="bold" text-anchor="middle">IDLE</text>

  <rect x="180" y="30" width="100" height="50" rx="6" fill="#1c261f" stroke="#2ecc71" stroke-width="1.5" />
  <text x="230" y="60" fill="#e6eee8" font-size="12" font-weight="bold" text-anchor="middle">HOMING</text>

  <rect x="360" y="30" width="100" height="50" rx="6" fill="#1c261f" stroke="#2ecc71" stroke-width="1.5" />
  <text x="410" y="60" fill="#e6eee8" font-size="12" font-weight="bold" text-anchor="middle">AGITATING</text>

  <rect x="350" y="210" width="120" height="50" rx="6" fill="#1c261f" stroke="#2ecc71" stroke-width="1.5" />
  <text x="410" y="240" fill="#e6eee8" font-size="12" font-weight="bold" text-anchor="middle">STEP TO CHANNEL</text>

  <rect x="160" y="210" width="140" height="50" rx="6" fill="#1c261f" stroke="#2ecc71" stroke-width="1.5" />
  <text x="230" y="240" fill="#e6eee8" font-size="12" font-weight="bold" text-anchor="middle">MEASURING</text>

  <!-- Transitions -->
  <path d="M 75 130 C 75 80, 130 55, 172 55" fill="none" stroke="#2ecc71" stroke-width="1.5" marker-end="url(#fsm-arrow)" />
  <text x="110" y="70" fill="#a3b8aa" font-size="9" text-anchor="middle" transform="rotate(-20, 110, 70)">Start CMD</text>

  <path d="M 280 55 L 352 55" fill="none" stroke="#2ecc71" stroke-width="1.5" marker-end="url(#fsm-arrow)" />
  <text x="320" y="48" fill="#a3b8aa" font-size="9" text-anchor="middle">Home Found</text>

  <path d="M 410 80 L 410 202" fill="none" stroke="#2ecc71" stroke-width="1.5" marker-end="url(#fsm-arrow)" />
  <text x="415" y="145" fill="#a3b8aa" font-size="9" text-anchor="start">Cycle Done</text>

  <path d="M 350 235 L 308 235" fill="none" stroke="#2ecc71" stroke-width="1.5" marker-end="url(#fsm-arrow)" />
  <text x="329" y="228" fill="#a3b8aa" font-size="9" text-anchor="middle">Aligned</text>

  <path d="M 260 210 C 290 180, 320 180, 360 210" fill="none" stroke="#a3b8aa" stroke-width="1.2" stroke-dasharray="2,2" marker-end="url(#fsm-arrow)" />
  <text x="310" y="182" fill="#a3b8aa" font-size="9" text-anchor="middle">Next Channel</text>

  <path d="M 190 210 C 140 180, 120 170, 120 160" fill="none" stroke="#2ecc71" stroke-width="1.5" marker-end="url(#fsm-arrow)" />
  <text x="140" y="195" fill="#a3b8aa" font-size="9" text-anchor="middle">Finished</text>

  <!-- Cancel transitions -->
  <path d="M 180 65 L 120 135" fill="none" stroke="#e74c3c" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#fsm-cancel-arrow)" />
  <path d="M 360 70 L 122 145" fill="none" stroke="#e74c3c" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#fsm-cancel-arrow)" />
  <path d="M 350 220 L 124 165" fill="none" stroke="#e74c3c" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#fsm-cancel-arrow)" />
  <text x="150" y="115" fill="#e74c3c" font-size="9" text-anchor="middle">CMD:CANCEL</text>
</svg>
