<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="100%" style="max-width: 600px; height: auto; display: block; margin: 20px auto; background: #1b1e22; border-radius: 8px; border: 1px solid rgba(61, 220, 132, 0.2); font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="gui-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#3ddc84" />
    </marker>
    <marker id="gui-arrow-muted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#9ba1aa" />
    </marker>
  </defs>

  <!-- Desktop GUI SPA Box -->
  <rect x="20" y="20" width="560" height="135" rx="8" fill="#141619" stroke="#3ddc84" stroke-width="2" />
  <text x="300" y="42" fill="#e8eaed" font-size="13" font-weight="bold" text-anchor="middle">Desktop GUI Application (Tkinter SPA Layout)</text>

  <!-- Views -->
  <rect x="35" y="60" width="110" height="40" rx="4" fill="#1b1e22" stroke="#9ba1aa" stroke-width="1.2" />
  <text x="90" y="84" fill="#e8eaed" font-size="11" text-anchor="middle">Menu View</text>

  <rect x="165" y="60" width="120" height="40" rx="4" fill="#1b1e22" stroke="#9ba1aa" stroke-width="1.2" />
  <text x="225" y="84" fill="#e8eaed" font-size="11" text-anchor="middle">Diagnostics View</text>

  <rect x="305" y="60" width="120" height="40" rx="4" fill="#1b1e22" stroke="#9ba1aa" stroke-width="1.2" />
  <text x="365" y="84" fill="#e8eaed" font-size="11" text-anchor="middle">Calibration View</text>

  <rect x="445" y="60" width="120" height="85" rx="4" fill="#24282e" stroke="#3ddc84" stroke-width="1.5" />
  <text x="505" y="80" fill="#e8eaed" font-size="11" font-weight="bold" text-anchor="middle">Reaction Hub</text>
  <!-- Mini plot sketch in Reaction Hub -->
  <rect x="455" y="90" width="100" height="45" rx="2" fill="#141619" stroke="rgba(61, 220, 132, 0.3)" />
  <path d="M 460 125 Q 485 120, 510 105 T 550 98" fill="none" stroke="#3ddc84" stroke-width="1.5" />
  <circle cx="510" cy="105" r="2" fill="#3ddc84" />
  <circle cx="550" cy="98" r="2" fill="#3ddc84" />

  <!-- Calibration mapping arrow -->
  <path d="M 425 80 L 439 80" fill="none" stroke="#9ba1aa" stroke-width="1.2" marker-end="url(#gui-arrow-muted)" />
  <text x="432" y="73" fill="#9ba1aa" font-size="8" text-anchor="middle">Fits</text>

  <!-- Threaded Serial Manager -->
  <rect x="140" y="195" width="320" height="60" rx="6" fill="#141619" stroke="#3ddc84" stroke-width="2" />
  <text x="300" y="218" fill="#e8eaed" font-size="12" font-weight="bold" text-anchor="middle">Threaded Serial Manager (Asynchronous UART)</text>
  <text x="300" y="235" fill="#9ba1aa" font-size="10" text-anchor="middle">Runs in a background thread to prevent UI freezing</text>

  <!-- Connections between GUI and Serial Manager -->
  <!-- Send Command -->
  <path d="M 490 145 L 490 225 L 470 225" fill="none" stroke="#3ddc84" stroke-width="1.5" marker-end="url(#gui-arrow)" />
  <text x="495" y="180" fill="#9ba1aa" font-size="10" text-anchor="start">Commands</text>

  <!-- Receive Data -->
  <path d="M 140 225 L 110 225 L 110 110 L 210 110 L 210 106" fill="none" stroke="#3ddc84" stroke-width="1.5" marker-end="url(#gui-arrow)" />
  <path d="M 110 120 L 350 120 L 350 106" fill="none" stroke="#3ddc84" stroke-width="1.5" marker-end="url(#gui-arrow)" />
  <text x="102" y="180" fill="#9ba1aa" font-size="10" text-anchor="end">Data Stream</text>
</svg>
