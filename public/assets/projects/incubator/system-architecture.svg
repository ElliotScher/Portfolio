<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" width="100%" style="max-width: 600px; height: auto; display: block; margin: 20px auto; background: #243028; border-radius: 8px; border: 1px solid rgba(46, 204, 113, 0.2); font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#2ecc71" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#a3b8aa" />
    </marker>
  </defs>
  <!-- Desktop App -->
  <rect x="20" y="20" width="560" height="90" rx="8" fill="#1c261f" stroke="#2ecc71" stroke-width="2" />
  <text x="300" y="45" fill="#e6eee8" font-size="14" font-weight="bold" text-anchor="middle">Desktop Application (Raspberry Pi Host)</text>
  
  <rect x="40" y="60" width="230" height="40" rx="4" fill="#243028" stroke="rgba(46, 204, 113, 0.4)" />
  <text x="155" y="85" fill="#e6eee8" font-size="12" text-anchor="middle">Tkinter GUI Dashboard</text>
  
  <rect x="330" y="60" width="230" height="40" rx="4" fill="#243028" stroke="rgba(46, 204, 113, 0.4)" />
  <text x="445" y="85" fill="#e6eee8" font-size="12" text-anchor="middle">SciPy Least-Squares Fitting</text>

  <!-- Communication Arrows -->
  <path d="M 180 110 L 180 190" stroke="#2ecc71" stroke-width="2" marker-end="url(#arrow)" />
  <text x="170" y="155" fill="#a3b8aa" font-size="11" text-anchor="end">Serial Commands (UART)</text>
  
  <path d="M 420 190 L 420 110" stroke="#2ecc71" stroke-width="2" marker-end="url(#arrow)" />
  <text x="430" y="155" fill="#a3b8aa" font-size="11" text-anchor="start">Telemetry and OD Data</text>

  <!-- Arduino Firmware -->
  <rect x="80" y="190" width="440" height="80" rx="8" fill="#1c261f" stroke="#2ecc71" stroke-width="2" />
  <text x="300" y="212" fill="#e6eee8" font-size="14" font-weight="bold" text-anchor="middle">Arduino Firmware Microcontroller</text>
  
  <rect x="100" y="226" width="400" height="34" rx="4" fill="#243028" stroke="rgba(46, 204, 113, 0.4)" />
  <text x="300" y="247" fill="#e6eee8" font-size="12" text-anchor="middle">Non-blocking FSM (Homing &amp; Carousel Positioning)</text>

  <!-- IO Connection lines -->
  <path d="M 190 270 L 190 310" stroke="#a3b8aa" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-muted)" />
  <text x="180" y="295" fill="#a3b8aa" font-size="10" text-anchor="end">Step/Dir Commands</text>

  <path d="M 410 310 L 410 270" stroke="#a3b8aa" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-muted)" />
  <text x="420" y="295" fill="#a3b8aa" font-size="10" text-anchor="start">Analog Read</text>

  <!-- Hardware components -->
  <rect x="40" y="310" width="240" height="40" rx="6" fill="#2d3b31" stroke="#a3b8aa" stroke-width="1.5" />
  <text x="160" y="334" fill="#e6eee8" font-size="11" text-anchor="middle">Stepper Motor (Wheel Alignment)</text>

  <rect x="320" y="310" width="240" height="40" rx="6" fill="#2d3b31" stroke="#a3b8aa" stroke-width="1.5" />
  <text x="440" y="334" fill="#e6eee8" font-size="11" text-anchor="middle">Analog Photodetector Sensor</text>
</svg>
