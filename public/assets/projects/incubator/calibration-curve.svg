<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" width="100%" style="max-width: 600px; height: auto; display: block; margin: 20px auto; background: #243028; border-radius: 8px; border: 1px solid rgba(46, 204, 113, 0.2); font-family: system-ui, -apple-system, sans-serif;">
  <!-- Grid Lines -->
  <line x1="70" y1="180" x2="550" y2="180" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
  <line x1="70" y1="150" x2="550" y2="150" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
  <line x1="70" y1="110" x2="550" y2="110" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
  <line x1="70" y1="60" x2="550" y2="60" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
  
  <line x1="120" y1="30" x2="120" y2="210" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
  <line x1="200" y1="30" x2="200" y2="210" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
  <line x1="320" y1="30" x2="320" y2="210" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
  <line x1="420" y1="30" x2="420" y2="210" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
  <line x1="530" y1="30" x2="530" y2="210" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />

  <!-- Axes -->
  <line x1="70" y1="210" x2="550" y2="210" stroke="#a3b8aa" stroke-width="1.5" />
  <line x1="70" y1="30" x2="70" y2="210" stroke="#a3b8aa" stroke-width="1.5" />

  <!-- X-Axis Labels -->
  <text x="310" y="245" fill="#e6eee8" font-size="11" text-anchor="middle">Analog Sensor Voltage (V)</text>
  <text x="120" y="224" fill="#a3b8aa" font-size="9" text-anchor="middle">0.5V</text>
  <text x="200" y="224" fill="#a3b8aa" font-size="9" text-anchor="middle">1.0V</text>
  <text x="320" y="224" fill="#a3b8aa" font-size="9" text-anchor="middle">2.0V</text>
  <text x="420" y="224" fill="#a3b8aa" font-size="9" text-anchor="middle">3.0V</text>
  <text x="530" y="224" fill="#a3b8aa" font-size="9" text-anchor="middle">4.5V</text>

  <!-- Y-Axis Labels -->
  <text x="25" y="120" fill="#e6eee8" font-size="11" text-anchor="middle" transform="rotate(-90, 25, 120)">Optical Density (OD)</text>
  <text x="62" y="213" fill="#a3b8aa" font-size="9" text-anchor="end">0.0</text>
  <text x="62" y="183" fill="#a3b8aa" font-size="9" text-anchor="end">0.5</text>
  <text x="62" y="153" fill="#a3b8aa" font-size="9" text-anchor="end">1.0</text>
  <text x="62" y="113" fill="#a3b8aa" font-size="9" text-anchor="end">1.5</text>
  <text x="62" y="63" fill="#a3b8aa" font-size="9" text-anchor="end">2.0</text>

  <!-- Logarithmic Calibration Curve Fit -->
  <path d="M 120 60 Q 200 120, 320 160 T 530 205" fill="none" stroke="#2ecc71" stroke-width="2.5" />

  <!-- Data Points and Error Bars -->
  <!-- Point 1 -->
  <line x1="120" y1="52" x2="120" y2="68" stroke="#e6eee8" stroke-width="1" />
  <circle cx="120" cy="60" r="4" fill="#e6eee8" />

  <!-- Point 2 -->
  <line x1="200" y1="112" x2="200" y2="124" stroke="#e6eee8" stroke-width="1" />
  <circle cx="200" cy="118" r="4" fill="#e6eee8" />

  <!-- Point 3 -->
  <line x1="320" y1="154" x2="320" y2="166" stroke="#e6eee8" stroke-width="1" />
  <circle cx="320" cy="160" r="4" fill="#e6eee8" />

  <!-- Point 4 -->
  <line x1="420" y1="172" x2="420" y2="182" stroke="#e6eee8" stroke-width="1" />
  <circle cx="420" cy="177" r="4" fill="#e6eee8" />

  <!-- Point 5 -->
  <line x1="530" y1="199" x2="530" y2="209" stroke="#e6eee8" stroke-width="1" />
  <circle cx="530" cy="204" r="4" fill="#e6eee8" />

  <!-- Legend -->
  <rect x="360" y="35" width="175" height="50" rx="4" fill="#1c261f" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  
  <line x1="375" y1="48" x2="395" y2="48" stroke="#2ecc71" stroke-width="2" />
  <text x="405" y="52" fill="#e6eee8" font-size="9" text-anchor="start">Logarithmic Fit Model</text>
  
  <circle cx="385" cy="70" r="3.5" fill="#e6eee8" />
  <text x="405" y="73" fill="#e6eee8" font-size="9" text-anchor="start">Experimental Standards</text>
</svg>
