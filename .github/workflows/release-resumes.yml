name: Release Resumes

on:
  workflow_run:
    workflows: ["CI (Test Suites)"]
    branches:
      - main
    types:
      - completed

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and generate resumes
        run: npm run build-resumes

      - name: Get current date and time
        id: datetime
        run: echo "datetime=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.datetime.outputs.datetime }}
          name: Release ${{ steps.datetime.outputs.datetime }}
          body: |
            Automated release of portfolio resumes.

            This release contains the latest compiled resumes built from the source at commit ${{ github.sha }}.
          draft: false
          prerelease: false
          files: |
            src/data/resume/generated/*.pdf
