name: CI (Test Suites)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-typescript:
    name: Test TypeScript/Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest tests
        run: npm run test


