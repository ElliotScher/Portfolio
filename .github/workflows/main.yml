name: Deploy Portfolio and Release Resumes

on:
  push:
    branches:
      - main

jobs:
  build-resumes:
    name: Build Resumes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-fonts-recommended texlive-latex-extra

      - name: Build all resumes
        working-directory: src/data/resume
        run: python build_script.py --output-dir generated

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdfs
          path: src/data/resume/generated/

  commit-resumes:
    name: Commit Resumes
    needs: build-resumes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download PDF artifacts
        uses: actions/download-artifact@v4
        with:
          name: resume-pdfs
          path: src/data/resume/generated/

      - name: Commit and Push PDFs
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/resume/generated/
          git diff-index --quiet HEAD || (git commit -m "Automated PDF build [skip ci]" && git push)

  create-release:
    name: Create GitHub Release
    needs: build-resumes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download PDF artifacts
        uses: actions/download-artifact@v4
        with:
          name: resume-pdfs
          path: src/data/resume/generated/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: |
            Automated release of portfolio resumes.

            This release contains the latest compiled resumes built from the source at commit ${{ github.sha }}.
          draft: false
          prerelease: false
          files: |
            src/data/resume/generated/*.pdf

  build-website:
    name: Build Website
    needs: build-resumes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download PDF artifacts to public
        uses: actions/download-artifact@v4
        with:
          name: resume-pdfs
          path: public/resumes/

      - name: Build website
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-website:
    name: Deploy to GitHub Pages
    needs: build-website
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
